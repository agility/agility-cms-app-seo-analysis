<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff;
      font-family: "TTInterphasesPro", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #5800D4; text-decoration: none; }
    a:hover { color: #4600AA; text-decoration: underline; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; width: 272px; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px;">
    <div style="font-size: 14px; line-height: 20px; font-weight: 600; color: #111827; letter-spacing: -0.28px;">SEO Analysis</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px;">
    <label style="font-size: 14px; line-height: 20px; color: #374151; letter-spacing: -0.28px;">Focus keyphrase</label>
    <div style="border: 1px solid #D1D5DB; border-radius: 4px; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #6B7280; background: #ffffff;">e.g. headless CMS migration</div>
    <div style="font-size: 11px; line-height: 15px; color: #6B7280; letter-spacing: -0.22px;">The phrase you want this page to rank for. Every check below is scored against it.</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; border: 1px dashed #D1D5DB; border-radius: 4px; padding: 24px 16px; margin-top: 14px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <div style="font-size: 12px; line-height: 16px; color: #6B7280; letter-spacing: -0.24px;">Enter a focus keyphrase to analyze this page.</div>
  </div>

  <div style="border-top: 1px solid #E5E7EB; padding-top: 10px; margin-top: 16px;">
    <div style="font-size: 10px; line-height: 14px; color: #9CA3AF; letter-spacing: -0.2px;">Analysis powered by YoastSEO.js</div>
  </div>

</div>
</x-dc>
</body>
</html>
